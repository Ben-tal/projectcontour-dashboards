apiVersion: v1
kind: Namespace
metadata:
  name: contour-test
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: contour-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: contour-dashboard-test-prometheus
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: contour-dashboard-test-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: contour-dashboard-test-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: contour-test
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: contour-test
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: contour
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [projectcontour]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: contour
          - source_labels: [__meta_kubernetes_pod_ip]
            regex: (.+)
            replacement: $1:8000
            target_label: __address__
          - target_label: namespace
            replacement: projectcontour
          - target_label: service
            replacement: contour-envoy-metrics
      - job_name: envoy
        metrics_path: /stats/prometheus
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [projectcontour]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: envoy
          - source_labels: [__meta_kubernetes_pod_ip]
            regex: (.+)
            replacement: $1:8002
            target_label: __address__
          - target_label: namespace
            replacement: projectcontour
          - target_label: service
            replacement: contour-envoy-metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: contour-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - name: web
              containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: web
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: web
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: contour-test
spec:
  selector:
    app: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: web
