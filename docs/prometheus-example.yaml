# Example for the Project Contour quickstart pod labels and metrics ports.
# Prometheus needs get/list/watch permission for pods in projectcontour.
# Change the namespace, pod selectors, and ports to match your installation.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: contour
    metrics_path: /metrics
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [projectcontour]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: contour
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        action: keep
        regex: '8000'
      - source_labels: [__meta_kubernetes_pod_ip]
        regex: (.+)
        replacement: $1:8000
        target_label: __address__
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - target_label: service
        replacement: contour-envoy-metrics

  - job_name: envoy
    metrics_path: /stats/prometheus
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [projectcontour]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: envoy
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        action: keep
        regex: '8002'
      - source_labels: [__meta_kubernetes_pod_ip]
        regex: (.+)
        replacement: $1:8002
        target_label: __address__
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - target_label: service
        replacement: contour-envoy-metrics
